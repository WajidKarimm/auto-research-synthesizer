name: AI CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ars/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/ai_ci.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    if: ${{ secrets.GROQ_API_KEY != '' && secrets.TAVILY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run faithfulness eval smoke test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m ars.eval.run_evals --limit 3
