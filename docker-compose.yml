version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ARS_MODEL=${ARS_MODEL}
    depends_on:
      - redis
    command: uvicorn ars.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
